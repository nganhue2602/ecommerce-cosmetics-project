<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Thông tin chi tiết các dịch vụ giặt ủi trên nền tảng WASHUP." />
  <title>Chi tiết dịch vụ | WASHUP</title>
  <link rel="stylesheet" href="css/style.css" />

  <style>
    /* HEADER VÀ GIỎ HÀNG */
    .header-inner {
      position: relative;
    }

    .header-cart-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      margin-left: 12px;
    }

    .header-cart {
      position: relative;
      width: 46px;
      height: 46px;
      border: 1px solid #e5eaf3;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    .header-cart:hover {
      background: #eaf1ff;
      transform: translateY(-2px);
    }

    .cart-icon {
      font-size: 21px;
    }

    .cart-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 20px;
      background: #e53935;
      color: white;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* KHUNG GIỎ HÀNG XỔ XUỐNG */
    .cart-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 14px);
      right: 0;
      z-index: 1000;
      width: 360px;
      max-width: calc(100vw - 30px);
      max-height: 420px;
      overflow-y: auto;
      padding: 20px;
      background: #fff;
      border: 1px solid #e5eaf3;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
    }

    .cart-dropdown.active {
      display: block;
    }

    .cart-dropdown h3 {
      margin: 0 0 16px;
      color: #14213d;
    }

    .cart-empty {
      padding: 20px 10px;
      text-align: center;
      color: #64748b;
      background: #f8fafc;
      border-radius: 10px;
      line-height: 1.6;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 0;
      border-bottom: 1px solid #e5eaf3;
    }

    .cart-item-info {
      flex: 1;
      min-width: 0;
    }

    .cart-item-info h3 {
      margin: 0 0 5px;
      font-size: 14px;
    }

    .cart-item-info p {
      margin: 0;
      color: #64748b;
      font-size: 12px;
      line-height: 1.5;
    }

    .cart-item-price {
      color: #0645ad;
      font-size: 13px;
      white-space: nowrap;
    }

    .cart-remove-btn {
      padding: 6px 9px;
      border: none;
      border-radius: 6px;
      background: #fff0f0;
      color: #dc3545;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .cart-remove-btn:hover {
      background: #dc3545;
      color: #fff;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 18px;
      padding-top: 15px;
      border-top: 1px solid #e5eaf3;
    }

    .cart-total strong {
      color: #0645ad;
      font-size: 18px;
    }

    .cart-view-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      padding: 10px;
      background: #007bff;
      color: #fff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    /* NHÓM NÚT CHỨC NĂNG */
    .service-detail-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .service-detail-actions button {
      cursor: pointer;
      font-family: inherit;
      appearance: none;
    }

    /* CHI TIẾT DỊCH VỤ */
    .service-detail-section {
      padding: 64px 0;
    }

    .service-detail-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 48px;
      align-items: start;
    }

    .service-detail-image {
      overflow: hidden;
      border-radius: 24px;
      background: #f3f5fa;
    }

    .service-detail-image img {
      display: block;
      width: 100%;
      height: 480px;
      object-fit: cover;
    }

    .service-detail-content {
      min-width: 0;
    }

    .service-detail-content h2 {
      margin: 12px 0;
      font-size: 32px;
      line-height: 1.3;
    }

    #service-category.section-kicker {
      display: inline-block;
      font-size: 22px !important;
      font-weight: 700 !important;
      letter-spacing: 1px;
    }

    .service-detail-content > p {
      color: #64748b;
      line-height: 1.8;
    }

    .service-detail-price {
      margin: 24px 0;
      padding: 22px 24px;
      border-radius: 16px;
      background: #f0f5ff;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .service-detail-price span {
      color: #64748b;
      font-size: 14px;
    }

    .service-detail-price strong {
      color: #0645ad;
      font-size: 28px;
    }

    .service-detail-info {
      display: grid;
      gap: 16px;
      margin-bottom: 24px;
    }

    .service-detail-info > div {
      padding: 16px 18px;
      border: 1px solid #e5eaf3;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .service-detail-info span {
      color: #64748b;
      font-size: 14px;
    }

    .service-detail-info strong {
      color: #14213d;
      line-height: 1.6;
    }

    .service-detail-note {
      padding: 18px 20px;
      margin-bottom: 24px;
      border-left: 4px solid #2459c5;
      border-radius: 8px;
      background: #f7f9fd;
    }

    .service-detail-note p {
      margin: 8px 0 0;
      color: #64748b;
      line-height: 1.7;
    }

    /* QUY TRÌNH SỬ DỤNG DỊCH VỤ */
    .service-process-section {
      padding: 64px 0;
      background: #f6f8fc;
    }

    .service-process-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      margin-top: 32px;
    }

    .service-process-card {
      padding: 28px;
      border: 1px solid #e5eaf3;
      border-radius: 18px;
      background: #fff;
    }

    .service-process-card > span {
      display: inline-flex;
      width: 44px;
      height: 44px;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      background: #eaf1ff;
      color: #0645ad;
      font-weight: 700;
    }

    .service-process-card h3 {
      margin: 18px 0 10px;
    }

    .service-process-card p {
      color: #64748b;
      line-height: 1.7;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .service-detail-section {
        padding: 40px 0;
      }

      .service-detail-layout {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .service-detail-image img {
        height: 320px;
      }

      .service-detail-content h2 {
        font-size: 26px;
      }

      #service-category.section-kicker {
        font-size: 19px !important;
      }

      .service-process-grid {
        grid-template-columns: 1fr;
      }

      .cart-dropdown {
        right: -5px;
      }
    }
  </style>
</head>

  <!-- HEADER -->
  <header class="site-header">

      <a class="brand" href="index.html" aria-label="WASHUP – Về trang chủ">
        <img

      <nav class="main-nav" aria-label="Điều hướng chính">

      <div class="header-cart-wrapper">

        <div class="cart-dropdown" id="cart-dropdown">

          <div id="cart-items">
            <div class="cart-empty">

          <div class="cart-total">
            <span>Tổng cộng:</span>
            <strong id="cart-total">0đ</strong>

    </div>
