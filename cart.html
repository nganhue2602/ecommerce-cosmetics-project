<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng - Washup</title>
  <!-- Nhúng file CSS của dự án -->
  <link rel="stylesheet" href="css/style.css"> 
</head>
<body>

  <!-- Thanh điều hướng Header -->
  <header style="padding: 15px 30px; background-color: #f8f9fa; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center;">
    <a href="index.html" style="font-weight: bold; text-decoration: none; font-size: 20px; color: #333;">WASHUP</a>
    <nav style="display: flex; gap: 20px;">
      <a href="index.html">Trang chủ</a>
      <a href="products.html">Sản phẩm / Dịch vụ</a>
      <a href="cart.html" style="font-weight: bold; color: #007bff;">
        Giỏ hàng (<span id="cart-badge">0</span>)
      </a>
    </nav>
  </header>

  <!-- Nội dung Giỏ hàng -->
  <main style="max-width: 1000px; margin: 30px auto; padding: 0 15px;">
    <h2>Giỏ hàng của bạn</h2>

    <!-- Trạng thái 1: Giỏ hàng RỖNG -->
    <div id="empty-cart-message" style="display: none; text-align: center; padding: 40px; border: 1px dashed #ccc; border-radius: 8px; margin-top: 20px;">
      <p style="font-size: 18px; color: #666;">Giỏ hàng của bạn hiện đang rỗng!</p>
      <a href="products.html" style="display: inline-block; margin-top: 10px; padding: 10px 20px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px;">Tiếp tục mua sắm</a>
    </div>

    <!-- Trạng thái 2: Bảng sản phẩm khi CÓ HÀNG -->
    <table id="cart-table" style="width: 100%; border-collapse: collapse; margin-top: 20px;">
      <thead>
        <tr style="background-color: #f2f2f2; text-align: left;">
          <th style="padding: 12px; width: 80px;">Hình ảnh</th>
          <th style="padding: 12px;">Tên sản phẩm</th>
          <th style="padding: 12px;">Đơn giá</th>
          <th style="padding: 12px;">Số lượng</th>
          <th style="padding: 12px;">Thành tiền</th>
          <th style="padding: 12px;">Thao tác</th>
        </tr>
      </thead>
      <tbody id="cart-items">
        <!-- Mã HTML sản phẩm sẽ được JavaScript chèn tự động vào đây -->
      </tbody>
    </table>

    <!-- Tổng tiền giỏ hàng -->
    <div style="margin-top: 25px; text-align: right; font-size: 20px; font-weight: bold;">
      <span>Tổng cộng: </span>
      <span id="total-price" style="color: #d9534f;">0 ₫</span>
    </div>
  </main>

  <!-- LIÊN KẾT TỆP JAVASCRIPT (Chú ý thứ tự) -->
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>

</body>
</html>
