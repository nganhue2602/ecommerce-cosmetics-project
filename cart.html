<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giỏ hàng - WASHUP</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="images/washup-logo-full.png">
  <style>
    .cart-container {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .cart-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background: #fff;
    }
    .cart-table th, .cart-table td {
      padding: 14px;
      text-align: left;
      border-bottom: 1px solid #e5eaf3;
    }
    .cart-table th {
      background-color: #f8fafc;
      color: #14213d;
    }
    .qty-btn {
      width: 28px;
      height: 28px;
      border: 1px solid #cbd5e1;
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    .qty-btn:hover {
      background: #e2e8f0;
    }
    .btn-remove {
      padding: 6px 12px;
      background-color: #dc3545;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-remove:hover {
      background-color: #bb2d3b;
    }
    .empty-box {
      text-align: center;
      padding: 50px 20px;
      background: #f8fafc;
      border-radius: 12px;
      border: 1px dashed #cbd5e1;
      margin-top: 20px;
    }
  </style>
</head>
<body>

 
<!-- HEADER -->
<header class="site-header">
  <div class="container header-inner">

    <!-- Logo -->
    <a class="brand" href="index.html" aria-label="WASHUP – Về trang chủ">
      <img
        src="images/washup-logo-wordmark.png"
        width="176"
        height="52"
        alt="WASHUP"
      />
    </a>

    <!-- Menu điều hướng chính -->
    <nav class="main-nav" aria-label="Điều hướng chính">
      <a href="index.html">Trang chủ</a>
      <a href="shops.html">Tiệm giặt</a>
      <a href="products.html">Dịch vụ</a>
      <a href="about.html">Giới thiệu</a>
    </nav>

    <!-- Nút tìm tiệm giặt -->
    <a class="header-cta" href="shops.html">
      Tìm tiệm giặt
      <span aria-hidden="true">↗</span>
    </a>

    <!-- Biểu tượng giỏ hàng -->
    <a
      href="cart.html"
      class="nav-cart"
      aria-label="Giỏ hàng"
      title="Giỏ hàng"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="9" cy="21" r="1"></circle>
        <circle cx="20" cy="21" r="1"></circle>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
      </svg>

      <span id="cart-badge">0</span>
    </a>

  </div>
</header>


  <!-- NỘI DUNG GIỎ HÀNG -->
  <main class="cart-container">
    <h2>Giỏ hàng của bạn</h2>

    <!-- THÔNG BÁO GIỎ HÀNG RỖNG (HÌNH 5.5) -->
    <div id="empty-cart-message" class="empty-box" style="display: none;">
      <p style="font-size: 18px; color: #64748b; margin-bottom: 15px;">Giỏ hàng của bạn hiện đang rỗng!</p>
      <a href="products.html" style="display: inline-block; padding: 10px 20px; background-color: #0645ad; color: white; text-decoration: none; border-radius: 8px; font-weight: bold;">Tiếp tục xem dịch vụ</a>
    </div>

    <!-- KHUNG BẢNG GIỎ HÀNG (KHI CÓ HÀNG) -->
    <div id="cart-content-wrapper">
      <table id="cart-table" class="cart-table">
        <thead>
          <tr>
            <th style="width: 80px;">Hình ảnh</th>
            <th>Tên dịch vụ</th>
            <th>Đơn giá</th>
            <th>Số lượng</th>
            <th>Thành tiền</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="cart-items">
          <!-- JS Render các sản phẩm tại đây -->
        </tbody>
      </table>

      <!-- TỔNG TIỀN -->
      <div style="margin-top: 25px; text-align: right; font-size: 20px; font-weight: bold;">
        <span>Tổng cộng: </span>
        <span id="total-price" style="color: #0645ad;">0 ₫</span>
      </div>
    </div>
  </main>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
